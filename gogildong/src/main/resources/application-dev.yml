spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 900000
    refresh-ttl: 604800000

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
item:
  image-base-url: https://mycdn.com/items/

logging:
  level:
    root: DEBUG
    org.springframework: DEBUG
    com.efub.gogildong: DEBUG
